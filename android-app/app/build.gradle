plugins {
    id 'com.android.application'
}

def keystorePropertiesFile = rootProject.file("key.properties")
def keystoreProperties = new Properties()
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

android {
    namespace 'com.pizzalab.scientifico'
    compileSdk 34

    defaultConfig {
        applicationId "com.pizzalab.scientifico"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "2.0.0"
    }

    signingConfigs {
        release {
            if (keystorePropertiesFile.exists()) {
                storeFile file(keystoreProperties['storeFile'])
                storePassword keystoreProperties['storePassword']
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
            } else if (file('../pizzalab-release.jks').exists()) {
                storeFile file('../pizzalab-release.jks')
                storePassword 'PizzaLabPro2026!'
                keyAlias 'pizzalab'
                keyPassword 'PizzaLabPro2026!'
            }
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.webkit:webkit:1.10.0'
    // Google Mobile Ads (AdMob) SDK
    implementation 'com.google.android.gms:play-services-ads:23.0.0'
}
